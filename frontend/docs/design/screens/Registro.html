<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A2F1B}a:hover{color:#2A1A0E}
</style>
<style>html{background:#E7DCCB}body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FEF3E2; color: #4A2F1B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px 24px 16px; gap: 18px">
<div style="display: flex; align-items: center; gap: 8px; height: 44px; flex-shrink: 0"><a href="Main.html" aria-label="Volver" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -12px; color: #4A2F1B"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a><div style="font-size: 16px; font-weight: 600">Crear cuenta</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.15">Crea tu cuenta</h1><p style="margin: 0; font-size: 15px; line-height: 1.45; color: #6B5847">Guarda tus rutas y tus preferencias.</p></div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 10px"><button type="button" style="height: 52px; border-radius: 14px; border: 1px solid #A68A6D; background: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; color: #4A2F1B; cursor: pointer">Continuar con Google</button><button type="button" style="height: 52px; border-radius: 14px; border: 1px solid #A68A6D; background: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; color: #4A2F1B; cursor: pointer">Continuar con Apple</button></div>
<div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #6B5847"><div style="flex-grow: 1; height: 1px; background: #EBD9BF"></div><span>o con tu correo</span><div style="flex-grow: 1; height: 1px; background: #EBD9BF"></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="reg-correo" style="font-size: 14px; font-weight: 600">Correo electrónico</label><input id="reg-correo" type="email" placeholder="nombre@correo.com" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; border: 1px solid #A68A6D; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #4A2F1B"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="reg-clave" style="font-size: 14px; font-weight: 600">Contraseña</label><input id="reg-clave" type="password" placeholder="Mínimo 8 caracteres" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; border: 1px solid #A68A6D; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #4A2F1B"></div>
<label for="reg-terminos" style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; line-height: 1.35"><input id="reg-terminos" type="checkbox" style="width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: #4A2F1B"><span>Acepto los términos y la política de privacidad</span></label>
<a href="MisRutas.html" style="margin-top: auto; flex-shrink: 0; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #4A2F1B; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">Crear cuenta</a>
<a href="Login.html" style="align-self: center; display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 600; text-decoration: none">¿Ya tienes cuenta? Entrar</a>

</div>
</body>
</html>
