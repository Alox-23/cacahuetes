<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A2F1B}a:hover{color:#2A1A0E}
</style>
<style>html{background:#E7DCCB}body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FEF3E2; color: #4A2F1B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px 24px 28px; gap: 20px">
<div style="display: flex; align-items: center; gap: 8px; height: 44px; flex-shrink: 0"><a href="Perfil.html" aria-label="Volver" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -12px; color: #4A2F1B"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a><div style="font-size: 16px; font-weight: 600">Cuenta</div></div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="cu-nombre" style="font-size: 14px; font-weight: 600">Nombre</label><input id="cu-nombre" type="text" placeholder="[NOMBRE]" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; border: 1px solid #A68A6D; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #4A2F1B"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="cu-correo" style="font-size: 14px; font-weight: 600">Correo electrónico</label><input id="cu-correo" type="email" placeholder="[CORREO]" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; border: 1px solid #A68A6D; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #4A2F1B"></div>
<div style="background: #FFFFFF; border: 1px solid #EBD9BF; border-radius: 20px; padding: 0 20px; display: flex; flex-direction: column"><a href="#" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; color: #4A2F1B; text-decoration: none; font-size: 16px; font-weight: 500; border-bottom: 1px solid #F3E6D2"><span>Cambiar contraseña</span><span style="display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B5847" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></span></a><a href="#" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; color: #4A2F1B; text-decoration: none; font-size: 16px; font-weight: 500"><span>Idioma</span><span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 14px; color: #6B5847">Español</span><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B5847" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></span></a></div>
<div style="display: flex; flex-direction: column"><label for="cu-avisos" style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; line-height: 1.35"><input id="cu-avisos" type="checkbox" checked style="width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: #4A2F1B"><span>Avisarme el día antes de una ruta</span></label>
<label for="cu-valorar" style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; line-height: 1.35"><input id="cu-valorar" type="checkbox" checked style="width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: #4A2F1B"><span>Recordarme valorar las rutas pasadas</span></label>
</div>
<button type="button" style="align-self: flex-start; min-height: 44px; border: 0; background: transparent; padding: 0; font-family: inherit; font-size: 15px; font-weight: 600; color: #B42318; cursor: pointer">Eliminar cuenta</button>
<a href="Perfil.html" style="margin-top: auto; flex-shrink: 0; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #4A2F1B; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">Guardar cambios</a>

</div>
</body>
</html>
